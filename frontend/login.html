<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library - Login</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>📚 Smart Library</h1>
            <p class="subtitle">Management & Seat Reservation System</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@library.edu" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <div class="demo-info">
                <p><strong>Demo Credentials:</strong></p>
                <p>📧 student@library.edu | 🔑 student123</p>
                <p>📧 admin@library.edu | 🔑 admin123</p>
            </div>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
